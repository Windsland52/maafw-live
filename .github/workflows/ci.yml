name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.13 是 engines 声明的下限——跑它才让下限保持真实，不会无声上漂；24 是当前 LTS。
        # win32 是主要开发平台（win32 控制器路径），linux 覆盖 CI / 服务器侧安装。
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - 22.13
          - 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - run: npm run accept:offline
